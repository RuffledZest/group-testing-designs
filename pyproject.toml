[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "group-testing-designs"
version = "0.1.0"
description = "Verified small d-disjunct matrices (cover-free families) for group testing."
requires-python = ">=3.11"
dependencies = ["numpy", "numba"]

[project.optional-dependencies]
dev = ["pytest"]
sat = ["python-sat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
